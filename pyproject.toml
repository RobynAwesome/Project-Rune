[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-rune"
version = "0.1.0"
description = "RUNE — Runtime Unified Network Endorsement: fail-closed gate + append-only ledger"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kopano Labs" }]
dependencies = [
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
mcp = ["mcp>=1.0.0"]

[project.scripts]
rune = "rune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
